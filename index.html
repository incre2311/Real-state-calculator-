<div class="scene">

  <div class="particle p4"></div><div class="particle p5"></div>

  <div class="wrap">
    <header class="nav glass">
      <div class="brand"><i></i>REAL ESTATE LAB</div>
      <div class="nav-right">
        <select id="currencySelect" style="background:#ffffff55; border:1px solid #fff; border-radius:8px; padding:4px 8px; font-size:9px; color:#5f7480;">
          <option value="₹">₹ INR</option>
          <option value="$">$ USD</option>
          <option value="€">€ EUR</option>
          <option value="£">£ GBP</option>
        </select>
        <button id="saveDealHeader" class="ghost" style="padding:4px 10px;">💾 Save</button>
        <button id="loadDealHeader" class="ghost" style="padding:4px 10px;">📂 Load</button>
        <span id="saveStatus">● LIVE MODEL</span>
        <button id="reset" class="ghost">Reset</button>
      </div>
    </header>
